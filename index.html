<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Timer Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* 🎨 THEME VARIABLES - Change these to swap colors easily */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --accent-color: #00ffc8; /* Neon Teal */
            --accent-glow: 0 0 15px #00ffc8;
            --btn-hover: rgba(255, 255, 255, 0.2);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #eef2f3, #d9e2ec);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-color: #2d3436;
            --accent-color: #0984e3; /* Bright Blue */
            --accent-glow: 0 0 10px rgba(9, 132, 227, 0.5);
            --btn-hover: rgba(0, 0, 0, 0.05);
        }

        /* 🚀 CORE STYLES */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
            background: var(--bg-gradient);
            transition: background 0.5s ease;
            overflow: hidden;
        }

        .container {
            width: 380px;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h1 {
            color: var(--text-color);
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.2rem;
        }

        #display {
            font-size: 56px;
            font-weight: 600;
            color: var(--accent-color);
            margin: 25px 0;
            text-shadow: var(--accent-glow);
            font-variant-numeric: tabular-nums; /* Prevents text jumping */
        }

        /* 🎮 BUTTONS */
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        button {
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:active { transform: scale(0.95); }

        #startBtn { border-color: var(--accent-color); color: var(--accent-color); }
        #stopBtn { color: #ff7675; border-color: #ff7675; }

        /* 📜 LAP LIST */
        .laps-container {
            margin-top: 25px;
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
        }

        ul::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        li {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            color: var(--text-color);
            font-size: 14px;
            animation: slideIn 0.4s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 🌓 THEME TOGGLE */
        #themeToggle {
            margin-top: 20px;
            background: var(--accent-color);
            color: #111;
            width: 100%;
            border: none;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Stopwatch</h1>
        <div id="display">00:00:00</div>

        <div class="controls">
            <button id="startBtn" onclick="start()">Start</button>
            <button id="stopBtn" onclick="stop()">Stop</button>
            <button onclick="lap()">Lap</button>
            <button onclick="reset()">Reset</button>
        </div>

        <button id="themeToggle" onclick="toggleTheme()">Switch Theme</button>

        <div class="laps-container">
            <ul id="laps"></ul>
        </div>
    </div>

    <script>
        let startTime;
        let elapsedTime = 0;
        let timerInterval;

        function timeToString(time) {
            let diffInHrs = time / 3600000;
            let hh = Math.floor(diffInHrs);

            let diffInMin = (diffInHrs - hh) * 60;
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            let diffInMs = (diffInSec - ss) * 100;
            let ms = Math.floor(diffInMs);

            let formattedMM = mm.toString().padStart(2, "0");
            let formattedSS = ss.toString().padStart(2, "0");
            let formattedMS = ms.toString().padStart(2, "0");

            return `${formattedMM}:${formattedSS}:${formattedMS}`;
        }

        function print(txt) {
            document.getElementById("display").innerHTML = txt;
        }

        function start() {
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(function printTime() {
                elapsedTime = Date.now() - startTime;
                print(timeToString(elapsedTime));
            }, 10);
            showButton("STOP");
        }

        function stop() {
            clearInterval(timerInterval);
            showButton("START");
        }

        function reset() {
            clearInterval(timerInterval);
            print("00:00:00");
            elapsedTime = 0;
            showButton("START");
            document.getElementById("laps").innerHTML = "";
        }

        function lap() {
            if (elapsedTime > 0) {
                let li = document.createElement("li");
                li.innerHTML = `<span>Lap ${document.getElementById("laps").children.length + 1}</span> <span>${timeToString(elapsedTime)}</span>`;
                document.getElementById("laps").prepend(li);
            }
        }

        function showButton(buttonKey) {
            const startBtn = document.getElementById("startBtn");
            if (buttonKey === "STOP") {
                startBtn.disabled = true;
                startBtn.style.opacity = "0.5";
            } else {
                startBtn.disabled = false;
                startBtn.style.opacity = "1";
            }
        }

        function toggleTheme() {
            document.body.classList.toggle("light-mode");
        }
    </script>
</body>
</html>
